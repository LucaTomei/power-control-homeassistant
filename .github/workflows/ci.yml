name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  tests:
    name: Test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # each gets the newest Home Assistant that runs on it (3.14: the latest release)
        python: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements_test.txt
      - name: Install dependencies
        run: pip install -r requirements_test.txt
      - name: Run tests
        run: pytest -q

  hassfest:
    name: Hassfest (Home Assistant validation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          # brands: no logo submitted to home-assistant/brands yet
          # description/topics: set them in the repository "About" box
          ignore: brands description topics
